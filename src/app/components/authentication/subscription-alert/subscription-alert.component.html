@for (msg of messages; track $index) {
  <div
    class="flex items-center justify-between p-4 mt-6 rounded-xl border backdrop-blur-sm transition-all"
    [ngClass]="{
      'bg-amber-50 border-amber-200 text-amber-800': msg.severity === 'warn',
      'bg-rose-50 border-rose-200 text-rose-800': msg.severity === 'error',
      'bg-emerald-50 border-emerald-200 text-emerald-800': msg.severity === 'success',
      'bg-sky-50 border-sky-200 text-sky-800': msg.severity === 'info' || !msg.severity
    }"
  >
    <div class="flex items-center gap-3">
      <!-- Alert Icon -->
      <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span class="text-sm font-medium">{{ msg.detail }}</span>
    </div>

    <!-- Dismiss Button -->
    <button
      type="button"
      (click)="messages.splice($index, 1)"
      class="p-1 rounded-lg hover:bg-black/5 transition-colors"
      aria-label="Dismiss alert"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
}
