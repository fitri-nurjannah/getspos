<div class="tw-modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="relative w-full max-w-md md:max-w-lg mx-auto shadow-2xl rounded-2xl bg-white flex flex-col max-h-[90vh] overflow-hidden border">
  <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
      <h3 class="text-lg font-bold text-gray-800">
        {{ data.isCreating ? 'Create New Folder' : 'Rename Folder' }}
      </h3>
      <button (click)="dialogRef.close()" class="text-gray-400 hover:text-gray-600 p-1">
        <ng-icon name="heroXMark" size="20"></ng-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6">
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold uppercase tracking-wider text-gray-500">Folder Name</label>
        <input 
          #folderInput
          [value]="data.name"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
          placeholder="e.g. Marketing Assets" />
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-50 flex flex-col-reverse sm:flex-row gap-3 justify-end border-t border-gray-100">
      <button 
        (click)="dialogRef.close()"
        class="!w-full sm:!w-fit btn btn-black p-btn-small">
        Cancel
      </button>
      <button 
        (click)="dialogRef.close(folderInput.value)"
        [disabled]="!folderInput.value"
        class="!w-full sm:!w-fit btn btn-primary p-btn-small shadow-lg shadow-primary/20 transition-all">
        {{ data.isCreating ? 'Create' : 'Rename' }}
      </button>
    </div>
  </div>
</div>
