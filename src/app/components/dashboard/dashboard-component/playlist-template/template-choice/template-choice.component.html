<div class="mb-8">
  <h3 class="text-lg font-semibold mb-4 text-gray-800">Choose Template</h3>
  <div class="grid grid-cols-1 gap-4">
    <!-- Horizontal Box -->
    <button
      (click)="selectTemplate('horizontal')"
      [class.border-primary]="currentTemplate === 'horizontal'"
      class="flex flex-col items-center justify-center p-4 border-2 border-gray-300 rounded-lg cursor-pointer hover:border-primary transition-colors duration-200 relative group"
    >
      <div
        class="w-16 h-8 border-2 border-gray-400 rounded-md mb-2 group-hover:border-primary"
      ></div>
      <span class="text-sm font-medium text-gray-700 group-hover:text-primary"
        >Horizontal Box</span
      >
      @if (currentTemplate === "horizontal") {
        <svg
          class="absolute top-2 right-2 text-primary h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd"
          ></path>
        </svg>
      }
    </button>

    <!-- Vertical Box -->
    <button
      (click)="selectTemplate('vertical')"
      [class.border-primary]="currentTemplate === 'vertical'"
      class="flex flex-col items-center justify-center p-4 border-2 border-gray-300 rounded-lg cursor-pointer hover:border-primary transition-colors duration-200 relative group"
    >
      <div
        class="w-8 h-16 border-2 border-gray-400 rounded-md mb-2 group-hover:border-primary"
      ></div>
      <span class="text-sm font-medium text-gray-700 group-hover:text-primary"
        >Vertical Box</span
      >
      @if (currentTemplate === "vertical") {
        <svg
          class="absolute top-2 right-2 text-primary h-5 w-5"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd"
          ></path>
        </svg>
      }
    </button>
  </div>
</div>
