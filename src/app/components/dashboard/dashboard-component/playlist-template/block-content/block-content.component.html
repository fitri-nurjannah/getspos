@if (coverImages$ | async; as images) {
  <div class="flex justify-center py-4 sm:py-8">
    <div
      class="w-full border-2 border-dashed border-gray-300 bg-gray-50 flex items-center justify-center rounded-xl shadow-sm overflow-hidden"
      [ngClass]="{
        'flex-col h-72 sm:h-80 max-w-[260px] sm:max-w-[300px]': currentTemplate === 'vertical', 
        'flex-row h-40 sm:h-48 max-w-[320px] sm:max-w-[400px]': currentTemplate === 'horizontal'
      }"
    >
      <!-- Loop exactly based on the number of blocks requested -->
      @for (item of [].constructor(numberOfBlocks); track $index) {
        <div
          (click)="goToNextStep($index, ($index + 1) * 2)"
          class="group relative flex items-center justify-center text-gray-500 cursor-pointer border-gray-200 first:border-0 overflow-hidden"
          [ngClass]="{
            'border-t': currentTemplate === 'vertical' && $index > 0,
            'border-l': currentTemplate === 'horizontal' && $index > 0
          }"
          [style.width.%]="currentTemplate === 'vertical' ? 100 : (100 / numberOfBlocks)"
          [style.height.%]="currentTemplate === 'vertical' ? (100 / numberOfBlocks) : 100"
        >
          
          <!-- Background Image (Checks index in the emitted array) -->
          @if (images[$index]) {
            <div class="absolute inset-0 bg-cover bg-center" 
                 [style.background-image]="'url(' + imageBaseUrl + images[$index] + ')' | domSecurePipe: 'style'">
            </div>
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors"></div>
          }
  
          <div class="relative z-10 flex flex-col items-center justify-center gap-1 group-hover:scale-110 transition-transform">
             <div [class.text-white]="images[$index]" class="group-hover:text-blue-600 transition-colors">
                <ng-icon name="ionCreateOutline" size="1.4rem"></ng-icon>
             </div>
             <span class="text-[9px] sm:text-xs tracking-wider group-hover:text-blue-600 text-center" [class.text-white]="images[$index]">
               Manage Content
             </span>
          </div>
        </div>
      }
    </div>
  </div>
<div class="flex flex-col-reverse sm:flex-row gap-3 mt-4 sm:mt-2 items-center justify-between">
  <button class="!w-full sm:!w-auto btn btn-black btn-md" cdkStepperPrevious>Back</button>
  <button
    class="!w-full sm:!w-auto btn btn-primary btn-md"
    (click)="submitForm()"
    [disabled]="!_mainForm || _mainForm.invalid || isSubmittingForm">Submit</button>
</div>
}
