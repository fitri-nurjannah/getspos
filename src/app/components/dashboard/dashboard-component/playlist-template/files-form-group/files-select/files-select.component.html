<div class="tw-modal fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" role="dialog" aria-modal="true">
	
	<!-- 2. Modal Card -->
	<div class="relative bg-white shadow-2xl rounded-2xl max-w-full lg:max-w-[85vw] p-3 sm:p-6 flex flex-col overflow-hidden transition-all duration-300 max-h-[90vh] sm:max-h-fit">
  
    <!-- 1. Header (Fixed Height) -->
    <div class="flex-none flex items-center justify-between pb-4">
      <h2 class="text-2xl font-semibold text-offblack">{{ forCoverImage ? 'Choose cover image' : 'Select Files' }}</h2>
      <button (click)="dialogRef.close(false)" class="text-gray-400 hover:text-gray-600 transition-colors">
        <ng-icon name="lucideX" size="1.8rem"></ng-icon>
      </button>
    </div>
    <!-- Header Action Bar -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4 px-1">
      
      <!-- Left Side: Selection Count -->
      @if (!forCoverImage) {
        <div class="text-sm sm:text-base font-medium text-gray-600">
          <span class="text-primary font-bold">{{ selectedItems?.length }}</span> items selected
        </div>
      }

      <!-- Right Side: Action Buttons -->
      <div class="flex flex-wrap items-center justify-start lg:justify-end gap-2 w-full lg:w-auto">
        @if (!forCoverImage) {
          <button
            class="btn btn-small btn-primary flex-1 sm:flex-none"
            (click)="selectAll()"
          >
            <ng-icon name="matCheckCircleOutline"></ng-icon>
            <span class="whitespace-nowrap">Select All</span>
          </button>
          
          <button
            class="btn btn-small btn-black flex-1 sm:flex-none"
            (click)="unSelectAll()"
          >
            <ng-icon name="matRemoveCircleOutlineOutline"></ng-icon>
            <span class="whitespace-nowrap">Unselect All</span>
          </button>
        }
        
        <button
          (click)="saveSelection()"
          class="btn btn-small btn-primary !w-full sm:!w-32 shadow-lg shadow-primary/20"
        >
          Apply
        </button>
      </div>
    </div>

    <!-- Main Storage Container -->
    <!-- 
      1. Changed width from 80vw to responsive max-widths.
      2. Added bg-white and border to define the area clearly.
    -->
    <div class="w-full max-w-[95vw] lg:max-w-[85vw] mx-auto bg-white border border-gray-200 rounded-3xl shadow-sm overflow-hidden h-[75vh] sm:h-[70vh]">
      <div class="overflow-auto h-full w-full custom-scrollbar">
        <app-shared-files-storage
          [previouslySelectedItems]="selectedItems"
          [isInSelectModal]="true"
          [forSelectingSliderCoverImage]="forCoverImage"
          [disableDragAndMove]="forCoverImage"
          [sliderTypes]="sliderTypes"
        ></app-shared-files-storage>
      </div>
    </div>
  </div>
</div>
